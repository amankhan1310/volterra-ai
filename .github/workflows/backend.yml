# Phase 2: backend analytics (v1 parity port). Lint, strict typing, and the parity + unit test
# suite with the 85% coverage gate, on the oldest supported Python and on 3.12 (where sum()
# switched to compensated summation, a regression the source-hygiene tests guard against).
name: backend

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: backend
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: pip install uv==0.12.24
      - name: Sync locked dev environment
        run: uv sync --locked --python ${{ matrix.python }}
      - name: Ruff
        run: uv run --no-sync ruff check . && uv run --no-sync ruff format --check .
      - name: Mypy (strict)
        run: uv run --no-sync mypy
      - name: Pytest (parity + unit, coverage >= 85%)
        run: uv run --no-sync pytest
