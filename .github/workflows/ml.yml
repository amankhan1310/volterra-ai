# ML package (Phase 6 M1): dataset acquisition tooling.
# Lint, strict typing and the full test suite with the 85% coverage gate, on the oldest supported
# Python and on 3.12. Tests use a local HTTP server and generated bytes only: no dataset is ever
# downloaded in CI, and test_repository_hygiene.py fails the build if dataset files are tracked.
name: ml

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ML (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: ml
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: pip install uv==0.12.24
      - name: Sync locked dev environment
        run: uv sync --locked --python ${{ matrix.python }}
      - name: Ruff
        run: uv run --no-sync ruff check . && uv run --no-sync ruff format --check .
      - name: Mypy (strict)
        run: uv run --no-sync mypy
      - name: Pytest (acquisition + repository hygiene; coverage >= 85%)
        run: uv run --no-sync pytest
