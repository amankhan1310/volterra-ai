<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>VOLTERRA AI · Battery Intelligence</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  </head>
  <body>
    <aside id="side">
      <div class="logo" id="brand"></div>
      <nav id="nav"></nav>
      <div class="st">
        <div><i class="dot"></i>Simulation mode</div>
        <small>Seeded dataset · no vehicle link</small>
      </div>
    </aside>
    <div class="col">
      <header class="hd">
        <button class="ib burger" id="bg" aria-label="Open menu">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          >
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg></button
        ><button class="ib" id="cb" aria-label="Collapse sidebar">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="4" width="18" height="16" rx="2" />
            <path d="M9 4v16" />
          </svg>
        </button>
        <div>
          <span class="mu">Workspace</span> <span class="mu">/</span>
          <b id="pt">Overview</b>
        </div>
        <div class="fx"></div>
        <select class="qn" id="qn" aria-label="Quick navigation"></select
        ><span class="tag s" title="Seeded synthetic data, not a real vehicle"
          >Simulated · 2.0 Ah cell profile</span
        ><button class="ib" id="bell" aria-label="Notifications">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M6 9a6 6 0 0112 0c0 6 2 7 2 7H4s2-1 2-7M10 20a2 2 0 004 0"
            /></svg
          ><span class="bdg" id="bn"></span>
        </button>
      </header>
      <main id="main"></main>
    </div>
    <script src="core.js"></script>
    <script src="ui.js"></script>
  </body>
</html>
