[project]
name = "volterra-ml"
version = "0.1.0"
description = "VOLTERRA AI ML package: dataset acquisition (Phase 6 M1) and loaders (M2); features and models follow."
readme = "README.md"
requires-python = ">=3.10"
# Acquisition (M1) and the canonical column contract stay standard-library only; the loaders
# (M2+) read MATLAB files with scipy/numpy and write Parquet bundles with pyarrow.
dependencies = [
    "numpy>=1.26",
    "pyarrow>=17",
    "scipy>=1.13",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "mypy>=1.11",
  "ruff==0.6.9",
]

[tool.uv]
package = false
# Same supply-chain rule as backend/: only releases public for at least two weeks.
exclude-newer = "2026-10-29T00:00:00Z"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
xfail_strict = true
# A warning (e.g. numpy's ComplexWarning) can mean silently altered data: fail instead.
filterwarnings = ["error"]
markers = [
  "realdata: needs the downloaded datasets in VOLTERRA_DATA_DIR; skipped when they are absent (always in CI)",
]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=volterra_ml",
  "--cov-branch",
  "--cov-report=term-missing:skip-covered",
  "--cov-fail-under=85",
]

[tool.coverage.run]
branch = true
source = ["volterra_ml"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["volterra_ml", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
# Neither library ships type information; their objects are typed as Any at the boundary.
module = ["pyarrow", "pyarrow.*", "scipy", "scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false
