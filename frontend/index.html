<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#070a0f" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>VOLTERRA AI · Battery Intelligence</title>
    <script>
      // Theme (decision D2): dark by default; apply a saved light choice before the first paint.
      // Same key as src/state/theme.ts.
      try {
        if (localStorage.getItem("volterra-theme") === "light")
          document.documentElement.setAttribute("data-theme", "light");
      } catch (e) {
        // Storage unavailable: stay dark.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
