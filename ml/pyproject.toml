[project]
name = "volterra-ml"
version = "0.1.0"
description = "VOLTERRA AI ML package: dataset acquisition (Phase 6 M1); loaders, features and models follow."
readme = "README.md"
requires-python = ">=3.10"
# Phase 6 M1 (acquisition) is standard-library only. Parsers (M2+) add their own dependencies.
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "mypy>=1.11",
  "ruff==0.6.9",
]

[tool.uv]
package = false
# Same supply-chain rule as backend/: only releases public for at least two weeks.
exclude-newer = "2026-10-29T00:00:00Z"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
xfail_strict = true
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=volterra_ml",
  "--cov-branch",
  "--cov-report=term-missing:skip-covered",
  "--cov-fail-under=85",
]

[tool.coverage.run]
branch = true
source = ["volterra_ml"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["volterra_ml", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false
