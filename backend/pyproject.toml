[project]
name = "volterra-backend"
version = "0.0.0"
description = "VOLTERRA AI backend: analytics parity port (Phase 2); FastAPI service from Phase 3."
readme = "README.md"
requires-python = ">=3.10"
# app/analytics stays standard-library only (bit-exact parity needs full control over
# floating-point operation order; enforced by tests/unit/test_source_hygiene.py). The
# dependencies below serve the API and database layers only.
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.10",
  "pydantic-settings>=2.5",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "mypy>=1.11",
  "ruff==0.6.9",
  "httpx>=0.27",
]

[tool.uv]
package = false
# Only resolve releases that have been public for at least two weeks (supply-chain hygiene).
# Move this date forward deliberately when upgrading dependencies.
exclude-newer = "2026-10-29T00:00:00Z"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
xfail_strict = true
markers = [
  "db: needs PostgreSQL via TEST_DATABASE_URL; runs only against disposable volterra_test_* databases",
]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=app",
  "--cov-branch",
  "--cov-report=term-missing:skip-covered",
  "--cov-fail-under=85",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["app", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
# Test functions need no annotations; fixture JSON is untyped by nature.
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false
